<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placas UADAV Santa Fe</title><link rel="stylesheet" href="assets/css/panel.css"></head><body><header><strong>UADAV Santa Fe · Placas para redes</strong><a href="admin.html">Volver al panel</a></header><main><h1>Generador de placas</h1><p>Comunicados, beneficios, capacitaciones, convocatorias y avisos para afiliados. Descarga PNG; publicación manual.</p><div class="grid"><section><label for="format">Formato</label><select id="format"><option value="1080,1350">Publicación vertical 4:5 · 1080 × 1350</option><option value="1080,1920">Historias / Reels / Estados 9:16 · 1080 × 1920</option><option value="1080,1080">Cuadrado 1:1 · 1080 × 1080</option><option value="1920,1080">Horizontal 16:9 · 1920 × 1080</option></select><label for="category">Tipo de aviso</label><input id="category" value="INFORMACIÓN PARA AFILIADOS" maxlength="55"><label for="title">Título</label><textarea id="title" maxlength="240">Tu arte es tu trabajo. Tus derechos cuentan.</textarea><label for="detail">Detalle / fecha / contacto</label><textarea id="detail" maxlength="350">Seccional Provincia de Santa Fe</textarea><label for="brand">Marca</label><input id="brand" value="UADAV SANTA FE" maxlength="50"><label for="footer">Firma institucional</label><input id="footer" value="Secretario General Javier Aguilar – Conducción" maxlength="100"><label for="color">Color institucional</label><input id="color" type="color" value="#0f4c81"><label for="photo">Foto de fondo (opcional)</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><label for="logo">Logo (opcional)</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><label for="zoom">Zoom de foto</label><input id="zoom" type="range" min="100" max="250" value="100"><label for="x">Encuadre horizontal</label><input id="x" type="range" min="0" max="100" value="50"><label for="y">Encuadre vertical</label><input id="y" type="range" min="0" max="100" value="50"><div class="actions"><button id="clear">Quitar foto</button><button id="png">Descargar PNG</button><button id="save-template">Guardar configuración local</button></div><p id="status" role="status" aria-live="polite"></p></section><section><h2>Vista previa</h2><canvas id="canvas" aria-label="Vista previa de la placa"></canvas></section></div></main><script src="assets/js/placas.js" defer></script></body></html>
